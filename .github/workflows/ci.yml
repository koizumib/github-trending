# コードを push したときにテストを動かす。data/ だけの push（毎朝の routine）では動かさない。
name: テスト

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 依存を入れる
        run: pip install -e ".[dev]"

      - name: テスト
        run: python -m pytest
