# data/ から HTML を作って Cloudflare Pages に公開し、Discord に通知する。
# 毎朝の routine が data/ を push したとき、コードを push したとき、または Actions の画面から手動で動かしたときに動く。
name: サイトを作って公開する

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "schemas/**"
      - "pyproject.toml"
      - ".github/workflows/daily.yml"
  workflow_dispatch:

permissions:
  contents: read

# 公開が2つ同時に走らないように、順番待ちにする（途中で止めない）
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 依存を入れる
        run: pip install -e .

      - name: 要約の形を検査する
        run: python -m trending_digest validate

      - name: HTML を作る
        run: python -m trending_digest build

      - name: Cloudflare Pages に公開する
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=trending-digest --branch=main

  notify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 依存を入れる
        run: pip install -e .

      - name: Discord に送る（その日の分を1回だけ）
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m trending_digest notify

      - name: 送った日を data/notified.json に記録する
        run: |
          if [ -z "$(git status --porcelain -- data/notified.json)" ]; then
            echo "記録することはない"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notified.json
          git commit -m "Discord に送った日を記録 [skip ci]"
          git pull --rebase
          git push
