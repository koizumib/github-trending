# 毎朝 Trending を取得して分類し、要約の材料を集める。終わったら routine（Claude Code）を起動して要約させる。
# data/ は main に記録する（この push では公開も通知もしない）。材料は work ブランチに置く。
# GitHub の定期実行は混むと数時間遅れるので、時刻をずらして3回動かし、最初に動いた1回だけが取得する（0024）。
name: 取得と材料集め

on:
  schedule:
    - cron: "47 20 * * *"   # 日本時間 5:47
    - cron: "17 22 * * *"   # 日本時間 7:17（予備）
    - cron: "47 23 * * *"   # 日本時間 8:47（予備）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 今日の分がもう取れていれば終わる（定期実行の2回目以降）
        id: check
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/daily/$TODAY.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今日（$TODAY）の分は取得済みなので、何もしない"
          fi

      - uses: actions/setup-python@v7
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 依存を入れる
        if: steps.check.outputs.skip != 'true'
        run: pip install -e .

      - name: Trending を取得して、材料を集める
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m github_trending prepare

      - name: data/ を main に記録する
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "記録することはない"
            exit 0
          fi
          git commit -m "${{ steps.check.outputs.today }} の Trending を記録 [skip ci]"
          git pull --rebase
          git push

      - name: 材料を work ブランチに置く（毎回まるごと上書き）
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd .work
          git init -q -b work
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "${{ steps.check.outputs.today }} の材料"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" work

      - name: routine を起動して要約を始めさせる
        if: steps.check.outputs.skip != 'true'
        env:
          ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$ROUTINE_TOKEN" ]; then
            echo "::warning::Secrets に CLAUDE_ROUTINE_TOKEN がないので、routine を起動しない"
            exit 0
          fi
          code=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            "https://api.anthropic.com/v1/claude_code/routines/trig_01VBSyXRh8g9UMrCLPSrneVQ/fire" \
            -H "Authorization: Bearer $ROUTINE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"${{ steps.check.outputs.today }} の材料を work ブランチに置きました\"}")
          echo "routine の起動：HTTP $code"
          if [ "${code:0:1}" != "2" ]; then
            python -m github_trending alert "routine を起動できませんでした（HTTP $code）。claude.ai/code/routines から手で動かしてください。トークンの期限切れなら、作り直して Secrets の CLAUDE_ROUTINE_TOKEN を差し替えてください。"
          fi

      - name: 失敗したら Discord に知らせる
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m github_trending alert "取得と材料集め（prepare）が失敗しました。Trending のページを読み取れなかった可能性があります。GitHub の Actions タブで記録を確かめてください。"
