# 毎朝 6:00（日本時間）に Trending を取得して分類し、要約の材料を集める。
# data/ は main に記録する（この push では公開も通知もしない）。材料は work ブランチに置く。
# 7:00 の routine（Claude Code）が work ブランチの材料を読んで要約を書く。
name: 取得と材料集め

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare.yml"

permissions:
  contents: write

concurrency:
  group: prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 依存を入れる
        run: pip install -e .

      - name: Trending を取得して、材料を集める
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m trending_digest prepare

      - name: data/ を main に記録する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "記録することはない"
            exit 0
          fi
          git commit -m "$(TZ=Asia/Tokyo date +%F) の Trending を記録 [skip ci]"
          git pull --rebase
          git push

      - name: 材料を work ブランチに置く（毎回まるごと上書き）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd .work
          git init -q -b work
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "$(TZ=Asia/Tokyo date +%F) の材料"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" work

      - name: 失敗したら Discord に知らせる
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m trending_digest alert "取得と材料集め（prepare）が失敗しました。Trending のページを読み取れなかった可能性があります。GitHub の Actions タブで記録を確かめてください。"
