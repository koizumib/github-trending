# 毎朝 9:00（日本時間）に、今日の分が届いているかを確かめる。
# 届いていなければ（routine が動かなかった、Trending を読み取れなかった）Discord に知らせる。
name: 見張り

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 依存を入れる
        run: pip install -e .

      - name: 今日の分があるか確かめる
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m trending_digest watchdog
